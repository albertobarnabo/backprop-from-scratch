[project]
name = "albi-mlp"
version = "0.1.0"
description = "Learn backpropagation by building an MLP from scratch with numpy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["checks"]
